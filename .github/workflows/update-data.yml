name: Update season data

on:
  schedule:
    - cron: "0 */8 * * *"        # three times a day; lines move, SurvivorGrid refreshes Tuesdays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build season.json
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m pipeline.build
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/season.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "data: refresh season.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
