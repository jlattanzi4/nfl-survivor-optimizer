[project]
name = "nfl-survivor-optimizer"
version = "0.1.0"
description = "Builds the season data behind the NFL survivor pool optimizer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "numpy>=1.24",
    "requests>=2.31",
    "scipy>=1.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# A two-line redirect kept for the old Streamlit address; it imports streamlit, which isn't a dependency.
extend-exclude = ["app.py"]
